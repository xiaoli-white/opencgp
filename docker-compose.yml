# ============================================================
# OpenCGP · docker compose
#
# NOTE: this file expects backend/Dockerfile and frontend/Dockerfile,
# which are not part of the repo yet. For local development start the
# two processes directly (see README "Quick start").
# ============================================================

services:
  backend:
    build:
      context: ./backend
    container_name: opencgp-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # API base URL baked into the bundle
        VITE_API_BASE: ${VITE_API_BASE:-}
    container_name: opencgp-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    restart: unless-stopped
