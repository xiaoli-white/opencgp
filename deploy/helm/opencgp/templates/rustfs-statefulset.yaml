{{- if and .Values.rustfs.enabled (eq .Values.mode "single") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opencgp.fullname" . }}-rustfs
  labels:
    {{- include "opencgp.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  serviceName: {{ include "opencgp.fullname" . }}-rustfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "opencgp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "opencgp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      securityContext:
        {{- toYaml .Values.rustfs.podSecurityContext | nindent 8 }}
      containers:
        - name: rustfs
          image: "{{ .Values.rustfs.image.repository }}:{{ .Values.rustfs.image.tag }}"
          imagePullPolicy: {{ .Values.rustfs.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.rustfs.securityContext | nindent 12 }}
          args:
            {{- toYaml .Values.rustfs.args | nindent 12 }}
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencgp.secretName" . }}
                  key: RUSTFS_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opencgp.secretName" . }}
                  key: RUSTFS_SECRET_KEY
            - name: RUSTFS_REGION
              value: {{ .Values.config.s3Region | quote }}
          ports:
            - name: s3
              containerPort: {{ .Values.rustfs.service.port }}
              protocol: TCP
            - name: console
              containerPort: {{ .Values.rustfs.service.consolePort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if not .Values.rustfs.persistence.enabled }}
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if .Values.rustfs.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - {{ .Values.rustfs.persistence.accessMode }}
        {{- if .Values.rustfs.persistence.storageClass }}
        storageClassName: {{ .Values.rustfs.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.persistence.size }}
  {{- end }}
{{- end }}
