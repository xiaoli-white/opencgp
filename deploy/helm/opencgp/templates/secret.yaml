{{- if not .Values.secrets.existingSecret }}
{{- $name := include "opencgp.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $data := dict }}
{{- if and $existing $existing.data }}
{{- $data = $existing.data }}
{{- end }}
{{- $authSecret := .Values.secrets.authSecret }}
{{- if and (not $authSecret) (hasKey $data "OPENCGP_AUTH_SECRET") }}
{{- $authSecret = index $data "OPENCGP_AUTH_SECRET" | b64dec }}
{{- end }}
{{- if not $authSecret }}
{{- $authSecret = randAlphaNum 48 }}
{{- end }}
{{- $s3AccessKey := include "opencgp.s3AccessKey" . }}
{{- if and (not $s3AccessKey) (hasKey $data "OPENCGP_S3_ACCESS_KEY") }}
{{- $s3AccessKey = index $data "OPENCGP_S3_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if not $s3AccessKey }}
{{- $s3AccessKey = printf "opencgp-%s" (randAlphaNum 16) }}
{{- end }}
{{- $s3SecretKey := include "opencgp.s3SecretKey" . }}
{{- if and (not $s3SecretKey) (hasKey $data "OPENCGP_S3_SECRET_KEY") }}
{{- $s3SecretKey = index $data "OPENCGP_S3_SECRET_KEY" | b64dec }}
{{- end }}
{{- if not $s3SecretKey }}
{{- $s3SecretKey = randAlphaNum 40 }}
{{- end }}
{{- $llmApiKey := .Values.secrets.llmApiKey }}
{{- if and (not $llmApiKey) (hasKey $data "OPENCGP_LLM_API_KEY") }}
{{- $llmApiKey = index $data "OPENCGP_LLM_API_KEY" | b64dec }}
{{- end }}
{{- $imageApiKey := .Values.secrets.imageApiKey }}
{{- if and (not $imageApiKey) (hasKey $data "OPENCGP_IMAGE_API_KEY") }}
{{- $imageApiKey = index $data "OPENCGP_IMAGE_API_KEY" | b64dec }}
{{- end }}
{{- $websearchApiKey := .Values.secrets.websearchApiKey }}
{{- if and (not $websearchApiKey) (hasKey $data "OPENCGP_WEBSEARCH_API_KEY") }}
{{- $websearchApiKey = index $data "OPENCGP_WEBSEARCH_API_KEY" | b64dec }}
{{- end }}
{{- $smtpPassword := .Values.secrets.smtpPassword }}
{{- if and (not $smtpPassword) (hasKey $data "OPENCGP_SMTP_PASSWORD") }}
{{- $smtpPassword = index $data "OPENCGP_SMTP_PASSWORD" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opencgp.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  OPENCGP_AUTH_SECRET: {{ $authSecret | b64enc | quote }}
  OPENCGP_DATABASE_DSN: {{ include "opencgp.databaseDsn" . | b64enc | quote }}
  OPENCGP_S3_ACCESS_KEY: {{ $s3AccessKey | b64enc | quote }}
  OPENCGP_S3_SECRET_KEY: {{ $s3SecretKey | b64enc | quote }}
  RUSTFS_ACCESS_KEY: {{ $s3AccessKey | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ $s3SecretKey | b64enc | quote }}
  {{- if $llmApiKey }}
  OPENCGP_LLM_API_KEY: {{ $llmApiKey | b64enc | quote }}
  {{- end }}
  {{- if $imageApiKey }}
  OPENCGP_IMAGE_API_KEY: {{ $imageApiKey | b64enc | quote }}
  {{- end }}
  {{- if $websearchApiKey }}
  OPENCGP_WEBSEARCH_API_KEY: {{ $websearchApiKey | b64enc | quote }}
  {{- end }}
  {{- if $smtpPassword }}
  OPENCGP_SMTP_PASSWORD: {{ $smtpPassword | b64enc | quote }}
  {{- end }}
{{- end }}
