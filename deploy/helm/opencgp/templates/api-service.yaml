{{- if eq .Values.mode "ha" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencgp.apiName" . }}
  labels:
    {{- include "opencgp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "opencgp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- end }}
