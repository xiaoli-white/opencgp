{{- if and .Values.api.pdb.enabled (include "opencgp.apiWorkloadEnabled" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opencgp.apiWorkloadName" . }}
  labels:
    {{- include "opencgp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "opencgp.selectorLabels" . | nindent 6 }}
      {{- if eq .Values.mode "ha" }}
      app.kubernetes.io/component: api
      {{- else }}
      app.kubernetes.io/component: backend
      {{- end }}
{{- end }}
{{- if and .Values.worker.pdb.enabled (include "opencgp.workerWorkloadEnabled" .) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opencgp.workerName" . }}
  labels:
    {{- include "opencgp.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  minAvailable: {{ .Values.worker.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "opencgp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
{{- end }}
