nameOverride: ""
fullnameOverride: ""

notes:
  database: "database.backend 目前只有 sqlite adapter 落地，生产建议等待 postgres adapter 或改用托管数据库；sqlite 依赖 PVC，只允许单副本"
  replicas: "backend.replicas > 1 必须使用外部 PostgreSQL + 外部 Redis + 外部对象存储；SQLite 与 ReadWriteOnce PVC 只能单副本，replicas>1 会导致数据损坏"
  executor: "集群内没有 docker socket，executor.backend 保持 none；需要代码实跑请部署独立 runner 或使用可信节点上的 local 后端"
  frontend: "VITE_API_BASE 是构建期变量，构建前端镜像时必须注入 /api；运行时由 nginx 同源反代 /api 到 backend service，避免 CORS 与硬编码后端地址"
  images: "本 chart 假定镜像已构建并推送；opencgp/backend 与 opencgp/frontend 可参考 deploy/docker 下的 Dockerfile 自行构建"
  storage: "storage.backend=s3 时所有对象写入 s3Endpoint 指定的桶；单机可用 chart 内置 rustfs，生产建议用云对象存储并关闭 rustfs.enabled"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

backend:
  image:
    repository: opencgp/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8000
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  probe:
    startupSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /data
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

frontend:
  image:
    repository: opencgp/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  apiPrefix: /api
  clientMaxBodySize: 32m
  proxyReadTimeout: 300s
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  auth:
    enabled: false
    password: ""
  appendonly: true
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 9000
    consolePort: 9001
  args:
    - /data
    - --address
    - ":9000"
    - --console-address
    - ":9001"
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

config:
  appName: OpenCGP
  env: production
  authMode: required
  authTokenTtlHours: 168
  requireApproval: "true"
  lockTtlSeconds: 120
  databaseBackend: sqlite
  databasePath: /data/course_studio.db
  vectorstoreBackend: simple
  vectorstorePath: /data/vectorstore
  storageBackend: s3
  storageRoot: /data/storage
  s3Endpoint: ""
  s3Bucket: course-studio
  s3Region: us-east-1
  s3Prefix: tenants
  queueBackend: redis
  redisUrl: ""
  jobConcurrency: 2
  jobSsePingSeconds: 15
  executorBackend: none
  execTimeout: 10
  websearchBackend: none
  websearchUrl: ""
  websearchMethod: POST
  websearchResultPath: results
  imageBackend: none
  imageBaseUrl: https://api.openai.com/v1
  imageModel: gpt-image-1
  llmBackend: openai_compat
  llmBaseUrl: ""
  llmModel: ""
  embeddingBackend: none
  extraEnv: {}

secrets:
  existingSecret: ""
  authSecret: ""
  s3AccessKey: ""
  s3SecretKey: ""
  llmApiKey: ""
  imageApiKey: ""
  websearchApiKey: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencgp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

networkPolicy:
  enabled: false
  monitoringNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: monitoring
