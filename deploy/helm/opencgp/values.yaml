nameOverride: ""
fullnameOverride: ""

mode: single

notes:
  mode: "mode=single 渲染 backend-deployment（API+Worker 合一，JOB_CONCURRENCY>0）；mode=ha 渲染 api-deployment（JOB_CONCURRENCY=0）+ worker-deployment"
  database: "统一使用 PostgreSQL；mode=single 可用内置 postgres StatefulSet，mode=ha 必须提供 externalDatabase.dsn 且内置 postgres 自动关闭"
  api: "API 节点只处理 HTTP 请求，JOB_CONCURRENCY=0 保证不消费队列；所有实例必须共用同一个 Redis DB，否则任务会被错误的实例抢走"
  worker: "worker-deployment 不接流量、不带 Service，扩缩容依据 CPU 或 opencgp_queue_backlog 队列积压"
  executor: "集群内没有 docker socket，executor.backend 保持 none；需要代码实跑请部署独立 runner 或使用可信节点上的 local 后端"
  frontend: "VITE_API_BASE 是构建期变量，构建前端镜像时必须注入 /api；运行时由 nginx 同源反代 /api 到 api/backend service"
  images: "本 chart 假定镜像已构建并推送；backend.image 同时用于单机 backend、API 与 Worker"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

backend:
  image:
    repository: opencgp/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8000
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  probe:
    startupSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /data
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

api:
  replicas: 2
  jobConcurrency: 0
  containerPort: 8000
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  probe:
    startupSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
  pdb:
    enabled: false
    minAvailable: 1
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

worker:
  enabled: true
  replicas: 2
  jobConcurrency: 2
  containerPort: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  autoscaling:
    enabled: false
    metric: cpu
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    queueBacklogThreshold: 50
  pdb:
    enabled: false
    minAvailable: 1
  extraPodAnnotations: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 120

externalDatabase:
  enabled: false
  dsn: ""
  poolSize: 8

externalRedis:
  enabled: false
  url: ""

externalS3:
  enabled: false
  endpoint: ""
  bucket: opencgp
  region: us-east-1
  accessKey: ""
  secretKey: ""
  prefix: tenants

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storage: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  credentials:
    user: opencgp
    password: opencgp
    database: opencgp
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

frontend:
  image:
    repository: opencgp/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  apiPrefix: /api
  clientMaxBodySize: 32m
  proxyReadTimeout: 300s
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  auth:
    enabled: false
    password: ""
  appendonly: true
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 9000
    consolePort: 9001
  args:
    - /data
    - --address
    - ":9000"
    - --console-address
    - ":9001"
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

config:
  appName: OpenCGP
  env: production
  authMode: required
  authTokenTtlHours: 168
  requireApproval: "true"
  lockTtlSeconds: 120
  databaseBackend: postgres
  databasePath: /data/opencgp.db
  databasePoolSize: 8
  vectorstoreBackend: postgres
  vectorstorePath: /data/vectorstore
  storageBackend: s3
  storageRoot: /data/storage
  s3Endpoint: ""
  s3Bucket: opencgp
  s3Region: us-east-1
  s3Prefix: tenants
  queueBackend: redis
  redisUrl: ""
  jobConcurrency: 2
  jobSsePingSeconds: 15
  executorBackend: none
  execTimeout: 10
  notifyBackend: none
  smtpHost: ""
  smtpPort: 587
  smtpUser: ""
  smtpFrom: ""
  smtpTls: "true"
  smtpTimeout: "10"
  websearchBackend: none
  websearchUrl: ""
  websearchMethod: POST
  websearchResultPath: results
  imageBackend: none
  imageBaseUrl: https://api.openai.com/v1
  imageModel: gpt-image-1
  llmBackend: openai_compat
  llmBaseUrl: ""
  llmModel: ""
  embeddingBackend: none
  extraEnv: {}

secrets:
  existingSecret: ""
  authSecret: ""
  s3AccessKey: ""
  s3SecretKey: ""
  llmApiKey: ""
  imageApiKey: ""
  websearchApiKey: ""
  smtpPassword: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencgp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  monitoringNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: monitoring
