nameOverride: ""
fullnameOverride: ""

mode: single

notes:
  mode: "mode=single 渲染 backend-deployment（API+Worker 合一，JOB_CONCURRENCY>0）；mode=ha 渲染 api-deployment（JOB_CONCURRENCY=0）+ worker-deployment"
  database: "统一使用 PostgreSQL；mode=single 可用内置 postgres StatefulSet，mode=ha 必须提供 externalDatabase.dsn 且内置 postgres 自动关闭"
  api: "API 节点只处理 HTTP 请求，JOB_CONCURRENCY=0 保证不消费队列；所有实例必须共用同一个 Redis DB，否则任务会被错误的实例抢走"
  worker: "worker-deployment 不接流量、不带 Service，扩缩容依据 CPU 或 opencgp_queue_backlog 队列积压"
  executor: "集群内没有 docker socket，executor.backend 保持 none；需要代码实跑请部署独立 runner 或使用可信节点上的 local 后端"
  frontend: "VITE_API_BASE 是构建期变量，构建前端镜像时必须注入 /api；运行时由 nginx 同源反代 /api 到 api/backend service"
  images: "本 chart 假定镜像已构建并推送；backend.image 同时用于单机 backend、API 与 Worker"

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

backend:
  image:
    repository: opencgp/backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8000
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  probe:
    startupSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    mountPath: /data
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

api:
  replicas: 2
  jobConcurrency: 0
  containerPort: 8000
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  service:
    type: ClusterIP
    port: 8000
    annotations: {}
  probe:
    startupSeconds: 30
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: ""
  pdb:
    enabled: false
    minAvailable: 1
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 30

worker:
  enabled: true
  replicas: 2
  jobConcurrency: 2
  containerPort: 8000
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi
  autoscaling:
    enabled: false
    metric: cpu
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    queueBacklogThreshold: 50
  pdb:
    enabled: false
    minAvailable: 1
  extraPodAnnotations: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  terminationGracePeriodSeconds: 120

externalDatabase:
  enabled: false
  dsn: ""
  poolSize: 8

externalRedis:
  enabled: false
  url: ""

externalS3:
  enabled: false
  endpoint: ""
  bucket: opencgp
  region: us-east-1
  accessKey: ""
  secretKey: ""
  prefix: tenants

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  storage: 20Gi
  storageClass: ""
  accessMode: ReadWriteOnce
  credentials:
    user: opencgp
    password: opencgp
    database: opencgp
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 2Gi
  podSecurityContext:
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL

frontend:
  image:
    repository: opencgp/frontend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  apiPrefix: /api
  clientMaxBodySize: 32m
  proxyReadTimeout: 300s
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

redis:
  enabled: true
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  auth:
    enabled: false
    password: ""
  appendonly: true
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 999
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

rustfs:
  enabled: true
  image:
    repository: rustfs/rustfs
    tag: "latest"
    pullPolicy: IfNotPresent
  service:
    port: 9000
    consolePort: 9001
  args:
    - /data
    - --address
    - ":9000"
    - --console-address
    - ":9001"
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 10001
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

config:
  appName: OpenCGP
  env: production
  authMode: required
  authTokenTtlHours: 168
  requireApproval: "true"
  lockTtlSeconds: 120
  databaseBackend: postgres
  databasePath: /data/opencgp.db
  databasePoolSize: 8
  vectorstoreBackend: postgres
  vectorstorePath: /data/vectorstore
  storageBackend: s3
  storageRoot: /data/storage
  s3Endpoint: ""
  s3Bucket: opencgp
  s3Region: us-east-1
  s3Prefix: tenants
  queueBackend: redis
  redisUrl: ""
  jobConcurrency: 2
  jobSsePingSeconds: 15
  executorBackend: none
  execTimeout: 10
  notifyBackend: none
  smtpHost: ""
  smtpPort: 587
  smtpUser: ""
  smtpFrom: ""
  smtpTls: "true"
  smtpTimeout: "10"
  websearchBackend: none
  websearchUrl: ""
  websearchMethod: POST
  websearchResultPath: results
  imageBackend: none
  imageBaseUrl: https://api.openai.com/v1
  imageModel: gpt-image-1
  llmBackend: openai_compat
  llmBaseUrl: ""
  llmModel: ""
  embeddingBackend: none
  extraEnv: {}

secrets:
  existingSecret: ""
  authSecret: ""
  s3AccessKey: ""
  s3SecretKey: ""
  llmApiKey: ""
  embeddingApiKey: ""
  rerankApiKey: ""
  imageApiKey: ""
  websearchApiKey: ""
  smtpPassword: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opencgp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  monitoringNamespaceLabel:
    key: kubernetes.io/metadata.name
    value: monitoring

# Advanced backend tuning. Each key becomes OPENCGP_<KEY> in the ConfigMap.
# Defaults mirror backend/app/config.py.
tuning:
  # Hybrid retrieval: fusion strategy, quotas, vector scan limits
  HYBRID_FUSION: "rrf"
  HYBRID_LSH_BITS: "12"
  HYBRID_MAX_PER_SOURCE: "3"
  HYBRID_MAX_VECTOR_ROWS: "200000"
  HYBRID_RRF_K: "60"
  HYBRID_VECTOR_WEIGHT: "0.55"

  # Keyword score floor
  SEARCH_MIN_SCORE: "0.15"

  # Chunking and upload limits
  INGEST_CHUNK_OVERLAP: "120"
  INGEST_CHUNK_SIZE: "800"
  INGEST_MAX_FILE_MB: "20"

  # Document parser backend
  PARSER_BACKEND: "builtin"

  # Embedding provider defaults (API key comes from secrets)
  EMBEDDING_BASE_URL: ""
  EMBEDDING_BATCH: "32"
  EMBEDDING_DIM: ""
  EMBEDDING_DIMENSION: "1024"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_QUERY_PREFIX: ""
  EMBEDDING_TIMEOUT: "20"

  # Rerank defaults (API key comes from secrets)
  RERANK_BACKEND: "none"
  RERANK_BASE_URL: ""
  RERANK_BATCH: "100"
  RERANK_CHARS: "2000"
  RERANK_MODEL: ""
  RERANK_NORMALIZE: "auto"
  RERANK_RAW_SCORES: false
  RERANK_RETRIES: "2"
  RERANK_TIMEOUT: "20"
  RERANK_TOP_N: "12"
  RERANK_WEIGHT: "0.5"

  # Evidence budget for generation
  GENERATION_DEFAULT_MODE: "strict"
  GENERATION_EVIDENCE_CHAR_LIMIT: "600"
  GENERATION_MAX_EVIDENCE: "8"
  GENERATION_TOP_K: "8"

  # Outline blueprint defaults
  BLUEPRINT_DEFAULT_MODE: ""
  BLUEPRINT_TOP_K: "6"

  # Follow-up context budget
  CONVERSATION_CONTENT_CHAR_LIMIT: "6000"
  CONVERSATION_EVIDENCE_CHAR_LIMIT: "600"
  CONVERSATION_HISTORY_CHAR_LIMIT: "400"
  CONVERSATION_HISTORY_LIMIT: "20"

  # Queue behaviour and SSE cadence
  JOB_BRPOP_TIMEOUT: "2"
  JOB_MAX_ATTEMPTS: "3"
  JOB_SSE_INTERVAL: "0.6"
  JOB_SSE_MAX_SECONDS: "600"

  # Page fetch used to enrich search snippets
  WEBSEARCH_FETCH_CHARS: "4000"
  WEBSEARCH_FETCH_ENABLED: true
  WEBSEARCH_FETCH_TIMEOUT: "8"
  WEBSEARCH_FETCH_TOP: "2"
  WEBSEARCH_TIMEOUT: "10"

  # EPUB/PDF export
  EXPORTER_FONT_BOLD: ""
  EXPORTER_FONT_REGULAR: ""
  EXPORTER_PDF_MARGIN_MM: "18"

  # Image generation limits
  IMAGE_MAX_BYTES: "8388608"
  IMAGE_TIMEOUT: "60"

  # Code sandbox limits
  EXEC_IMAGES: ""
  EXEC_MAX_BYTES: "65536"

  # Object storage timeout
  S3_TIMEOUT: "10"

  # Vector store connection pool
  VECTORSTORE_POOL_SIZE: "8"

  # Fallback recipients for admin notices
  NOTIFY_ADMIN_EMAIL: ""

