<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCGP</title>
    <meta
      name="description"
      content="OpenCGP · Open Content Generation Platform —— 检索取证、逐讲生成、追问修改、版本可回溯。"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("course-studio-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-backdrop" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
