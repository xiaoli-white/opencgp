<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236366f1'/%3E%3Cpath d='M9 21V11h4l3 6 3-6h4v10h-3v-5l-2 4h-4l-2-4v5z' fill='white'/%3E%3C/svg%3E"
    />
    <title>OpenCGP</title>
    <meta
      name="description"
      content="OpenCGP · Open Content Generation Platform — grounded retrieval, unit by unit generation, follow-up edits, versioned history."
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("course-studio-theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="app-backdrop" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
